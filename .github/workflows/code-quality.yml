name: Code quality

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Stylelint
        if: ${{ !cancelled() }}
        run: npm run lint:styles
